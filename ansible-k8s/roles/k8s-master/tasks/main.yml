---
# ============================================================
# k8s-master Role: Initialize Kubernetes Control Plane
# ============================================================

# -------- Check if cluster is already initialized (idempotency) --------
- name: Check if Kubernetes cluster is already initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: k8s_initialized
  tags: kubeadm_init

# -------- Pull required images --------
- name: Pull kubeadm required images
  ansible.builtin.command:
    cmd: kubeadm config images pull --cri-socket {{ cri_socket }}
  changed_when: false
  when: not k8s_initialized.stat.exists
  tags: kubeadm_init

# -------- Initialize the cluster --------
- name: Initialize Kubernetes cluster with kubeadm init
  ansible.builtin.command:
    cmd: >
      kubeadm init
      --apiserver-advertise-address={{ apiserver_advertise_address }}
      --pod-network-cidr={{ pod_network_cidr }}
      --cri-socket {{ cri_socket }}
    timeout: 300
  register: kubeadm_init_result
  when: not k8s_initialized.stat.exists
  tags: kubeadm_init

# -------- Set up kubeconfig for root --------
- name: Create .kube directory for root
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    mode: '0700'
  when: not k8s_initialized.stat.exists
  tags: kubeconfig

- name: Copy admin.conf to root's kubeconfig
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    remote_src: true
    owner: root
    group: root
    mode: '0600'
  when: not k8s_initialized.stat.exists
  tags: kubeconfig

# -------- Extract and save the join command --------
- name: Extract the kubeadm join command from init output
  ansible.builtin.shell:
    cmd: |
      kubeadm init --apiserver-advertise-address={{ apiserver_advertise_address }} \
                   --pod-network-cidr={{ pod_network_cidr }} \
                   --cri-socket {{ cri_socket }} \
                   --dry-run 2>/dev/null | grep -A1 "kubeadm join" | tr -d '\n' | sed 's/\\//g'
  register: join_command_dryrun
  changed_when: false
  when: k8s_initialized.stat.exists
  tags: join_command

- name: Generate fresh join token and extract command (when already initialized)
  ansible.builtin.shell:
    cmd: |
      kubeadm token create --print-join-command 2>/dev/null
  register: join_command_refresh
  changed_when: false
  when: k8s_initialized.stat.exists
  tags: join_command

- name: Set join command fact (fresh init)
  ansible.builtin.set_fact:
    join_command: "{{ kubeadm_init_result.stdout_lines | select('match', '^kubeadm join') | first | trim }}"
  when: not k8s_initialized.stat.exists
  tags: join_command

- name: Set join command fact (already initialized - use refreshed token)
  ansible.builtin.set_fact:
    join_command: "{{ join_command_refresh.stdout | trim }}"
  when: k8s_initialized.stat.exists
  tags: join_command

# -------- Save join command to file --------
- name: Save join command to a shared file
  ansible.builtin.copy:
    content: |
      # Kubernetes Worker Join Command
      # Generated by Ansible on {{ ansible_date_time.iso8601 }}
      # Run the following command on worker nodes to join the cluster:
      {{ join_command }}
    dest: "{{ kubeadm_join_command_file }}"
    mode: '0644'
  tags: join_command

# -------- Install Calico CNI --------
- name: Check if Calico is already installed
  ansible.builtin.shell:
    cmd: kubectl --kubeconfig=/etc/kubernetes/admin.conf get pods -n kube-system -l k8s-app=calico-node --no-headers 2>/dev/null | head -1
  register: calico_check
  changed_when: false
  failed_when: false
  tags: calico

- name: Install Calico CNI network plugin
  ansible.builtin.shell:
    cmd: kubectl --kubeconfig=/etc/kubernetes/admin.conf apply -f {{ calico_manifest_url }}
  register: calico_result
  changed_when: "'created' in calico_result.stdout"
  when: calico_check.stdout == ""
  tags: calico

# -------- Display join command at the end --------
- name: Display the join command for manual node addition
  ansible.builtin.debug:
    msg:
      - "======================================================"
      - "Kubernetes cluster initialized successfully!"
      - "Control Plane node: {{ inventory_hostname }}"
      - "Pod Network CIDR: {{ pod_network_cidr }}"
      - ""
      - "Join command for workers:"
      - "{{ join_command }}"
      - ""
      - "The join command is also saved to: {{ kubeadm_join_command_file }}"
      - "======================================================"
  tags: display