---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: ai
  labels:
    app.kubernetes.io/name: litellm
spec:
  replicas: 1
  strategy:
    # O container roda as migrations do Prisma no boot; duas réplicas
    # migrando ao mesmo tempo no Postgres compartilhado não termina bem.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
    spec:
      containers:
        - name: litellm
          # Imagem `-database`: roda `prisma migrate deploy` antes de subir.
          image: ghcr.io/berriai/litellm-database:v1.94.0
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/litellm/config.yaml
            - --port
            - "4000"
            - --num_workers
            - "1"
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            # LITELLM_MASTER_KEY, LITELLM_SALT_KEY, DATABASE_URL e as chaves
            # dos providers. Materializado pelo ESO a partir do OpenBao.
            - secretRef:
                name: litellm
          env:
            # --- Traces pro Phoenix -----------------------------------------
            - name: OTEL_EXPORTER
              value: otlp_http
            - name: OTEL_ENDPOINT
              value: http://phoenix-svc.ai.svc.cluster.local:6006/v1/traces
            - name: OTEL_SERVICE_NAME
              value: litellm
            - name: STORE_MODEL_IN_DB
              value: "True"
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
          livenessProbe:
            httpGet: {path: /health/liveliness, port: http}
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /health/readiness, port: http}
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 1Gi}
      volumes:
        - name: config
          configMap:
            name: litellm-config
