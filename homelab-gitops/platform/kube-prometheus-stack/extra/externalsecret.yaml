---
# O que está versionado é o *caminho* do segredo, não o segredo.
# Criar no OpenBao antes do primeiro sync:
#   bao kv put kv/homelab/grafana admin-user=admin admin-password='...'
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: homelab/grafana
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: homelab/grafana
        property: admin-password
