---
# A outra metade da ponte: como o cluster inteiro lê segredos do OpenBao.
#
# Este é o único objeto do repositório que sabe o endereço do cofre.
# Não há credencial nenhuma aqui — a autenticação é por ServiceAccount token,
# validado pelo OpenBao contra a API do Kubernetes. Nada pra vazar em Git.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    # O OpenBao é fork do Vault e mantém a API compatível, então o provider
    # `vault` do ESO funciona sem adaptação.
    vault:
      # >>> AJUSTE: IP do LXC do OpenBao no Proxmox.
      # Comece em http; docs/03 mostra como trocar pra https com CA própria.
      server: http://10.0.0.60:8200
      # Nome do mount KV, não o caminho do segredo.
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
