---
# Criar no OpenBao antes do primeiro sync:
#
#   bao kv put kv/homelab/litellm \
#     master-key="sk-$(openssl rand -hex 24)" \
#     salt-key="$(openssl rand -hex 24)" \
#     database-url="postgresql://litellm:SENHA@10.0.0.40:5432/litellm" \
#     anthropic-api-key="sk-ant-..." \
#     openai-api-key="sk-..."
#
# A salt-key criptografa as chaves de provider guardadas no banco do LiteLLM.
# Trocá-la depois torna ilegível tudo o que já foi salvo — defina uma vez e não mexa.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: litellm
    creationPolicy: Owner
  data:
    - secretKey: LITELLM_MASTER_KEY
      remoteRef: {key: homelab/litellm, property: master-key}
    - secretKey: LITELLM_SALT_KEY
      remoteRef: {key: homelab/litellm, property: salt-key}
    - secretKey: DATABASE_URL
      remoteRef: {key: homelab/litellm, property: database-url}
    - secretKey: ANTHROPIC_API_KEY
      remoteRef: {key: homelab/litellm, property: anthropic-api-key}
    - secretKey: OPENAI_API_KEY
      remoteRef: {key: homelab/litellm, property: openai-api-key}
    # Chave de sistema do Phoenix — desde que o Phoenix passou a exigir auth,
    # o exporter OTLP precisa mandar Bearer. Mesmo valor de
    # kv/homelab/phoenix-db:admin-secret.
    - secretKey: PHOENIX_ADMIN_SECRET
      remoteRef: {key: homelab/litellm, property: phoenix-admin-secret}
