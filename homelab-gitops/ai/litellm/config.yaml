model_list:
  # --- Anthropic ------------------------------------------------------
  - model_name: opus
    litellm_params:
      model: anthropic/claude-opus-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: sonnet
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: haiku
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # --- OpenAI ---------------------------------------------------------
  - model_name: gpt
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  # --- LM Studio (local, no Mac 10.0.0.150) ---------------------------
  # Modelos servidos pelo LM Studio na máquina do Leona. Custo zero por token
  # e o prompt não sai da LAN — bom pra teste, carga alta e dado sensível.
  #
  # Dependência frágil de propósito: se o Mac desligar ou o LM Studio fechar,
  # estes modelos somem. O `num_retries` do router não ajuda aqui, então não
  # aponte nada crítico pra eles.
  #
  # api_key é exigido pelo protocolo mas o LM Studio ignora o valor.
  - model_name: local-r1
    litellm_params:
      model: lm_studio/deepseek/deepseek-r1-0528-qwen3-8b
      api_base: http://10.0.0.150:1234/v1
      api_key: "lm-studio"
  - model_name: local-coder
    litellm_params:
      model: lm_studio/qwen2.5-coder-7b-instruct-mlx
      api_base: http://10.0.0.150:1234/v1
      api_key: "lm-studio"
  - model_name: local-vision
    litellm_params:
      model: lm_studio/qwen/qwen2.5-vl-7b
      api_base: http://10.0.0.150:1234/v1
      api_key: "lm-studio"
  - model_name: local
    litellm_params:
      model: lm_studio/qwen2.5-7b-instruct-1m
      api_base: http://10.0.0.150:1234/v1
      api_key: "lm-studio"
  - model_name: local-embed
    litellm_params:
      model: lm_studio/text-embedding-nomic-embed-text-v1.5
      api_base: http://10.0.0.150:1234/v1
      api_key: "lm-studio"

litellm_settings:
  # É isto que faz cada chamada virar um trace no Phoenix.
  callbacks: ["otel"]
  drop_params: true
  # Não logar o conteúdo dos prompts nos logs do pod — os traces do
  # Phoenix já guardam isso, num lugar com retenção definida.
  turn_off_message_logging: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Rotas de saúde sem autenticação, pro kubelet conseguir sondar.
  public_routes: ["/health/liveliness", "/health/readiness"]

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
