---
# Phoenix (Arize) — observabilidade de LLM: traces OTLP, evals, playground.
# Recebe os traces do LiteLLM (ver ai/litellm/configmap.yaml).

# --- Banco -------------------------------------------------------------------
# O chart empacota um Postgres (groundhog2k) e também sabe usar SQLite.
# Nenhum dos dois: usamos o Postgres que já existe no Proxmox.
postgresql:
  enabled: false
persistence:
  enabled: false

database:
  defaultRetentionPolicyDays: 30
  postgres:
    # >>> AJUSTE: host do Postgres no Proxmox.
    host: "10.0.0.40"
    port: 5432
    db: "phoenix"
    user: "phoenix"
    # A senha NÃO vem daqui — vem do Secret criado pelo ESO, injetada
    # abaixo em auth.secret[].valueFrom. Deixar em branco é intencional:
    # este campo vira ConfigMap em texto puro se preenchido.
    password: ""

auth:
  # Ligado. O Phoenix guarda o conteúdo dos prompts e das respostas — é o
  # serviço com o dado mais sensível da stack, não faz sentido ser o único
  # sem porta.
  enableAuth: true
  name: phoenix-secret
  # Todos os valores vêm do OpenBao via ESO; o chart não gera nada.
  createSecret: false
  secret:
    # Chave de criptografia do Phoenix. Trocar depois invalida o que já
    # foi cifrado com ela — defina uma vez.
    - key: PHOENIX_SECRET
      valueFrom:
        secretKeyRef:
          name: phoenix-db
          key: phoenix-secret

    # Chave de sistema: autentica chamadas de API/OTLP sem precisar criar
    # API key pela UI. É com ela que o LiteLLM manda os traces.
    - key: PHOENIX_ADMIN_SECRET
      valueFrom:
        secretKeyRef:
          name: phoenix-db
          key: admin-secret

    # Senha do admin no primeiro login. Troque pela UI depois.
    - key: PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD
      valueFrom:
        secretKeyRef:
          name: phoenix-db
          key: admin-initial-password

    - key: PHOENIX_POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: phoenix-db
          key: password

service:
  # O chart usa NodePort por padrão; com Traefik na frente não precisa.
  type: ClusterIP

server:
  port: 6006       # UI + OTLP/HTTP
  grpcPort: 4317   # OTLP/gRPC

resources:
  requests: {cpu: 100m, memory: 512Mi}
  limits: {memory: 1Gi}

ingress:
  # IngressRoute do Traefik no extra/, não o Ingress genérico do chart.
  enabled: false
