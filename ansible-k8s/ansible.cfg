[defaults]
# Inventory
inventory = inventory/hosts.ini

# Host key checking (set to False for first-time connections)
host_key_checking = False

# Remote user (can be overridden in inventory)
remote_user = root

# Number of parallel forks
forks = 10

# Timeout for SSH connections
timeout = 30

# Gathering facts
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 3600

# Display output (formato yaml legível)
# Para Ansible >= 2.13: use result_format=yaml no callback default
# Para Ansible < 2.13: descomente a linha abaixo
# stdout_callback = yaml
default_result_format = yaml
callbacks_enabled = ansible.posix.profile_tasks

# Error handling
retry_files_enabled = True
retry_files_save_path = /tmp/ansible-retry

# Roles path
roles_path = roles/

[ssh_connection]
# SSH pipelining for better performance
pipelining = True

# Control path for persistent connections
control_path = /tmp/ansible-%%h-%%p-%%r