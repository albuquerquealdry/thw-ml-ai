---
# Criar no OpenBao antes do primeiro sync:
#   bao kv put kv/homelab/phoenix-db password='...'
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: phoenix-db
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: phoenix-db
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef: {key: homelab/phoenix-db, property: password}
    - secretKey: phoenix-secret
      remoteRef: {key: homelab/phoenix-db, property: phoenix-secret}
    - secretKey: admin-secret
      remoteRef: {key: homelab/phoenix-db, property: admin-secret}
    - secretKey: admin-initial-password
      remoteRef: {key: homelab/phoenix-db, property: admin-initial-password}
