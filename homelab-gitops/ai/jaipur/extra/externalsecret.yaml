---
# Criar no OpenBao antes do primeiro sync:
#
#   bao kv put kv/homelab/jaipur \
#     db-password='<a senha do role jaipur no Postgres do LXC 105>' \
#     admin-email='albuquerquealdry@gmail.com' \
#     admin-password='<uma frase longa>' \
#     signing-key="$(openssl rand -hex 32)"
#
# `signing-key` não pode mudar depois que houver release assinada: ela é a chave
# ed25519 com que o registry assina cada versão. Trocar invalida toda assinatura
# já entregue a um cliente.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jaipur
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: jaipur
    creationPolicy: Owner
    # A DSN é montada aqui em vez de guardada inteira no OpenBao: host, porta e
    # database são configuração, não segredo, e ficam legíveis no Git.
    template:
      engineVersion: v2
      data:
        databaseUrl: "postgres://jaipur:{{ .dbPassword }}@10.0.0.40:5432/jaipur?sslmode=disable"
        adminEmail: "{{ .adminEmail }}"
        adminPassword: "{{ .adminPassword }}"
        signingKey: "{{ .signingKey }}"
  data:
    - secretKey: dbPassword
      remoteRef: {key: homelab/jaipur, property: db-password}
    - secretKey: adminEmail
      remoteRef: {key: homelab/jaipur, property: admin-email}
    - secretKey: adminPassword
      remoteRef: {key: homelab/jaipur, property: admin-password}
    - secretKey: signingKey
      remoteRef: {key: homelab/jaipur, property: signing-key}
