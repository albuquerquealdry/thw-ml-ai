---
# nip.io resolve *.10.0.0.180.nip.io -> 10.0.0.180 sem você configurar DNS nenhum.
# Trocar por um host real é só editar o match aqui e o global.domain no values.yaml.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`argocd.10.0.0.180.nip.io`)
      kind: Rule
      services:
        - name: argocd-server
          port: 80
