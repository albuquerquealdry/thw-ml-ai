---
# Camada de workloads de IA. Deliberadamente restrita: só pode criar recursos
# dentro dos seus namespaces e não pode tocar em nada cluster-scoped.
# Se o litellm.yaml um dia vier com um ClusterRoleBinding, o sync falha — e é isso que queremos.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ai
  namespace: argocd
spec:
  description: Workloads de IA/LLM (Phoenix, LiteLLM, Jaipur)
  sourceRepos:
    - https://github.com/albuquerquealdry/thw-ml-ai.git
    - registry-1.docker.io/arizephoenix
    # Charts próprios, publicados como OCI pelo repo que os versiona.
    - ghcr.io/albuquerquealdry/charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: ai
  clusterResourceWhitelist:
    # Só isto. `CreateNamespace=true` precisa criar o namespace `ai`, e Namespace
    # é cluster-scoped — com a lista vazia o sync falha com
    # "resource :Namespace is not permitted in project ai".
    # Continua barrado tudo que importa: ClusterRole, ClusterRoleBinding, CRD,
    # StorageClass, ValidatingWebhookConfiguration...
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
